name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting/lint and types are declared standards (root `npm run check`,
  # a clean `tsc`) but nothing enforced them, so drift could land on main
  # unnoticed. e2e is its own workflow (e2e.yml), it takes ~5 minutes.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same Node as devenv.nix (pkgs.nodejs_24 from devenv.lock), so CI and
          # the dev shell resolve and build identically. Bump both together.
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # Needed for the typecheck below (deps supply the ambient types).
      - run: npm ci
        working-directory: apps/mobile
      # Biome comes from devenv (pkgs.biome) locally; CI has no nix, so pin the
      # same version here — formatter output drifts between Biome majors, and an
      # unpinned CI copy would flag code the devshell considers correctly
      # formatted. Bump in step with devenv's biome. `ci` never writes.
      - name: Format + lint (Biome)
        run: npx --yes @biomejs/biome@2.5.13 ci apps/mobile supabase
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/mobile
      # Unit tests via node's built-in runner — no framework. Cheap to run and
      # guard real bugs (e.g. money formatting: a 50p trip once displayed as
      # "£1" while Stripe charged 50p).
      - name: Unit tests
        run: npm run test:unit
        working-directory: apps/mobile

name: Deploy edge functions

# The web app auto-deploys on merge (deploy-web.yml), but Supabase edge
# functions (supabase/functions/*) are hosted separately and were previously
# only deployable by hand with the CLI. This does the equivalent for them:
# on merge to main, deploy every function to the production project — so a
# change to sign-up / stripe-webhook / etc. actually reaches production without
# anyone opening a terminal.
#
# Requires one repo secret: SUPABASE_ACCESS_TOKEN
#   Create at https://supabase.com/dashboard/account/tokens, then add it under
#   the repo's Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Production project ref (same project the Pages site points at).
      PROJECT_REF: cunkkdbfylimkktwgfle
    steps:
      - uses: actions/checkout@v7
      - name: Check the access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it under" \
              "Settings → Secrets and variables → Actions (see this workflow's header)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Deploys all functions under supabase/functions, honouring per-function
      # settings in supabase/config.toml (e.g. verify_jwt = false for the Stripe
      # webhook and payment-return).
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

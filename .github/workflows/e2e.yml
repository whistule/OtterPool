name: e2e

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'supabase/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['apps/mobile/**', 'supabase/**', '.github/workflows/e2e.yml']

permissions:
  contents: read

jobs:
  # Playwright against a throwaway `supabase start` stack on the runner, so
  # seeding with the service-role key never touches a hosted project.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same pins as test.yml / deploy-supabase.yml, bump with devenv.
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            supabase/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # Unauthenticated pulls from public.ecr.aws get throttled ("Rate
      # exceeded") and only succeed on retry. The image set is fixed by the CLI
      # pin and config.toml, so key on those and skip the pulls entirely.
      - name: Cache Supabase images
        id: images
        uses: actions/cache@v6
        with:
          path: ~/supabase-images.tar
          key: supabase-images-${{ hashFiles('.github/workflows/e2e.yml', 'supabase/config.toml') }}
      - if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i ~/supabase-images.tar

      - name: Start Supabase
        run: supabase start
      - if: steps.images.outputs.cache-hit != 'true'
        run: docker save -o ~/supabase-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep /supabase/)
      # Same files dev-local.sh writes, but on 127.0.0.1 since the browser runs
      # on the runner too.
      - name: Write local env
        run: |
          eval "$(supabase status -o env)"
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > apps/mobile/.env.local
          printf "export const SUPABASE_URL = '%s';\nexport const SUPABASE_SERVICE_ROLE_KEY = '%s';\n" "$API_URL" "$SERVICE_ROLE_KEY" > supabase/config.secret.js

      - run: npm ci
        working-directory: supabase
      - run: npm ci
        working-directory: apps/mobile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile

      # pretest:e2e seeds the fixtures, Playwright starts Expo itself.
      - run: npm run test:e2e
        working-directory: apps/mobile

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/mobile/test-results/
          retention-days: 7

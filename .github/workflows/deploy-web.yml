name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web
      # GitHub Pages runs Jekyll, which drops underscore-prefixed dirs
      # (_expo/) — .nojekyll disables that so the JS/CSS bundle is served.
      - run: touch dist/.nojekyll
      # Dynamic routes (e.g. /profile/[id]) have no pre-rendered HTML file,
      # so a direct load/refresh 404s on the static host. GitHub Pages serves
      # 404.html for any unmatched path — point it at the app shell so the
      # client router can take over and render the route (URL preserved).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
